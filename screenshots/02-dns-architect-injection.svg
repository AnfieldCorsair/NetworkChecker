    <text x="22" y="164" fill="#C5D2E6" font-family="Segoe UI, Inter, sans-serif" font-size="12">Выберите профиль DNS («Классика DoH: Cloudflare + Google» или «Приватный Ninja: Njalla + LibreDNS») и вошейте его в подписку без поломки JSON.</text>
