    <text x="300" y="292" fill="#8B9BB4" font-family="Segoe UI, sans-serif" font-size="11">Для ценителей максимальной приватности</text>

    <rect x="38" y="318" width="488" height="156" rx="6" fill="#0B1120" stroke="#22304A" />
    <text x="52" y="342" fill="#93C5FD" font-family="Consolas, monospace" font-size="11" font-weight="bold">ЖИВАЯ СВЕРКА: СИСТЕМНЫЙ DNS ПРОВАЙДЕРА VS ЗАШИФРОВАННЫЙ DOH</text>
    <text x="52" y="368" fill="#4ADE80" font-family="Consolas, monospace" font-size="12">• youtube.com      — Системный: 142.250.185.174 | DoH: 142.250.185.174 (Чисто)</text>
    <text x="52" y="392" fill="#F87171" font-family="Consolas, monospace" font-size="12">• instagram.com    — Системный: 195.82.146.214  | DoH: 157.240.247.174 (ПОДМЕНА!)</text>
    <text x="52" y="416" fill="#F87171" font-family="Consolas, monospace" font-size="12">• discord.com      — Системный: NXDOMAIN        | DoH: 162.159.135.232 (ПОДМЕНА!)</text>
    <text x="52" y="440" fill="#4ADE80" font-family="Consolas, monospace" font-size="12">• gosuslugi.ru     — Яндекс 77.88.8.8 напрямую (без задержек и капчи)</text>

    <rect x="38" y="490" width="488" height="170" rx="6" fill="#0B1120" stroke="#16A34A" />
    <text x="52" y="514" fill="#4ADE80" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold">✓ Автоматическая валидация JSON перед сохранением</text>
    <text x="52" y="536" fill="#C5D2E6" font-family="Segoe UI, sans-serif" font-size="12">Программа сама разбирает синтаксическое дерево вашего конфига или подписки Happ,</text>
    <text x="52" y="556" fill="#C5D2E6" font-family="Segoe UI, sans-serif" font-size="12">вставляет секцию dns и routing без лишних или пропущенных запятых и проверяет</text>
    <text x="52" y="576" fill="#C5D2E6" font-family="Segoe UI, sans-serif" font-size="12">результат строгим парсером JsonDocument.Parse().</text>
    <rect x="52" y="602" width="460" height="40" rx="6" fill="#2563EB" />
