<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <rect width="1200" height="700" fill="#0B1120" rx="10" />
  <!-- Top Bar (Minimalist Basic Mode) -->
  <rect x="0" y="0" width="1200" height="122" fill="#0D1526" />
  <line x1="0" y1="122" x2="1200" y2="122" stroke="#22304A" stroke-width="1" />
  <text x="24" y="35" fill="#FFFFFF" font-family="Segoe UI, Inter, sans-serif" font-size="20" font-weight="bold">Контур ВПН</text>
  <text x="640" y="33" fill="#8B9BB4" font-family="Segoe UI, Inter, sans-serif" font-size="12">Минималистичный режим · нажмите для всех 6 вкладок</text>
  <rect x="964" y="14" width="212" height="28" rx="5" fill="#2563EB" />
  <text x="984" y="32" fill="#FFFFFF" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="600">Базовый режим (3 вкладки)</text>

  <!-- 3 Wide Basic Tabs -->
  <rect x="24" y="54" width="376" height="58" rx="6" fill="#17253F" stroke="#3B82F6" stroke-width="1.8" />
  <text x="40" y="72" fill="#60A5FA" font-family="Consolas, monospace" font-size="10.5" font-weight="bold">ШАГ 1</text>
  <text x="40" y="89" fill="#FFFFFF" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="600">Проверка ВПН и подписки</text>
  <text x="40" y="104" fill="#9BAAC2" font-family="Segoe UI, Inter, sans-serif" font-size="11">Вставьте ссылку подписки или ключ VLESS / AWG / HY2</text>

  <rect x="412" y="54" width="376" height="58" rx="6" fill="#0F172A" stroke="#22304A" stroke-width="1" />
  <text x="428" y="72" fill="#60A5FA" font-family="Consolas, monospace" font-size="10.5" font-weight="bold">ШАГ 2</text>
  <text x="428" y="89" fill="#FFFFFF" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="600">Репутация IP и Google RU</text>
  <text x="428" y="104" fill="#8B9BB4" font-family="Segoe UI, Inter, sans-serif" font-size="11">4 сигнала Google/YouTube и проверка всех IP подписки</text>

  <rect x="800" y="54" width="376" height="58" rx="6" fill="#0F172A" stroke="#22304A" stroke-width="1" />
  <text x="816" y="72" fill="#60A5FA" font-family="Consolas, monospace" font-size="10.5" font-weight="bold">ШАГ 3</text>
  <text x="816" y="89" fill="#FFFFFF" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="600">Заявка в техподдержку</text>
  <text x="816" y="104" fill="#8B9BB4" font-family="Segoe UI, Inter, sans-serif" font-size="11">Готовый отчёт для Telegram без личных ключей</text>

  <!-- Compact Guide Strip -->
  <rect x="0" y="123" width="1200" height="44" fill="#11192B" />
  <line x1="0" y1="167" x2="1200" y2="167" stroke="#22304A" stroke-width="1" />
  <text x="24" y="149" fill="#FFFFFF" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="bold">Проверка ВПН и подписки <tspan fill="#C5D2E6" font-weight="normal" font-size="12"> — вставьте ссылку подписки или ключ ниже и нажмите «Загрузить и проверить».</tspan></text>

  <!-- Verdict Summary Card -->
  <rect x="24" y="182" width="1152" height="74" rx="8" fill="#11192B" stroke="#22304A" />
  <text x="42" y="208" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="16" font-weight="bold">Надёжно: конфигурация защищена от ТСПУ РФ</text>
  <text x="42" y="228" fill="#9BAAC2" font-family="Segoe UI, sans-serif" font-size="12">VLESS Reality XHTTP · edge-eu.example.com:443 · SNI: www.microsoft.com</text>
  <text x="42" y="246" fill="#93C5FD" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600">Подписка «Happ Multi-Edge» загружена (3 локации) · Проверить пинг можно одним кликом</text>

  <text x="830" y="205" fill="#8B9BB4" font-family="Segoe UI, sans-serif" font-size="11">Ошибки</text>
  <text x="844" y="232" fill="#F87171" font-family="Segoe UI, sans-serif" font-size="22" font-weight="bold">0</text>
  <text x="896" y="205" fill="#8B9BB4" font-family="Segoe UI, sans-serif" font-size="11">Советы</text>
  <text x="910" y="232" fill="#FBBF24" font-family="Segoe UI, sans-serif" font-size="22" font-weight="bold">1</text>
  <text x="962" y="205" fill="#8B9BB4" font-family="Segoe UI, sans-serif" font-size="11">Отлично</text>
  <text x="978" y="232" fill="#4ADE80" font-family="Segoe UI, sans-serif" font-size="22" font-weight="bold">5</text>
  <rect x="1028" y="202" width="132" height="34" rx="5" fill="#2563EB" />
  <text x="1044" y="223" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold">Проверить узел</text>

  <!-- Single Clean Input Bar (No Raw Editor / Presets Clutter) -->
  <rect x="24" y="268" width="1152" height="86" rx="8" fill="#11192B" stroke="#22304A" />
  <text x="42" y="297" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="600">Подписка или ключ:</text>
  <rect x="176" y="278" width="800" height="30" rx="5" fill="#0B1120" stroke="#2E446B" />
  <text x="190" y="298" fill="#93C5FD" font-family="Consolas, monospace" font-size="12">https://sub.example.com/api/v1/client/subscribe?token=••••••••</text>
  <rect x="988" y="278" width="172" height="30" rx="5" fill="#2563EB" />
  <text x="1010" y="298" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold">Загрузить и проверить</text>

  <rect x="42" y="318" width="276" height="26" rx="5" fill="#162238" stroke="#2E446B" />
  <text x="54" y="335" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="11.5">Вшить DNS: Классика (Cloudflare + Google)</text>
  <rect x="330" y="318" width="266" height="26" rx="5" fill="#162238" stroke="#2E446B" />
  <text x="342" y="335" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="11.5">Скопировать выбранный узел (для Happ)</text>

  <!-- Left Column: Clean Nodes List Only -->
  <rect x="24" y="366" width="468" height="312" rx="8" fill="#11192B" stroke="#22304A" />
  <text x="42" y="392" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold">Локации подписки</text>
  <text x="42" y="412" fill="#93C5FD" font-family="Segoe UI, sans-serif" font-size="11.5">Выберите сервер для подробного разбора или копирования:</text>

  <rect x="42" y="426" width="432" height="58" rx="6" fill="#17253F" stroke="#3B82F6" />
  <text x="56" y="448" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold">#1 · ⚡ Автовыбор — включи и забудь</text>
  <text x="56" y="468" fill="#9BAAC2" font-family="Consolas, monospace" font-size="11">VLESS Reality XHTTP · edge-eu.example.com:443</text>
  <text x="386" y="448" fill="#4ADE80" font-family="Consolas, monospace" font-size="11.5" font-weight="bold">OK · 42 мс</text>
  <text x="366" y="468" fill="#4ADE80" font-family="Consolas, monospace" font-size="10">ЗАЩИЩЁН (РФ)</text>

  <rect x="42" y="492" width="432" height="54" rx="6" fill="#0B1120" stroke="#1E2C45" />
  <text x="56" y="514" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="600">#2 · 📶 Мобильный интернет · TCP Vision</text>
  <text x="56" y="534" fill="#9BAAC2" font-family="Consolas, monospace" font-size="11">VLESS Reality Vision · 198.51.100.42:443</text>
  <text x="386" y="514" fill="#4ADE80" font-family="Consolas, monospace" font-size="11.5" font-weight="bold">OK · 58 мс</text>

  <rect x="42" y="554" width="432" height="54" rx="6" fill="#0B1120" stroke="#1E2C45" />
  <text x="56" y="576" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="600">#3 · 🌍 Запасной протокол (Hysteria2)</text>
  <text x="56" y="596" fill="#9BAAC2" font-family="Consolas, monospace" font-size="11">Hysteria2 QUIC · 203.0.113.10:443</text>
  <text x="386" y="576" fill="#4ADE80" font-family="Consolas, monospace" font-size="11.5" font-weight="bold">OK · 61 мс</text>

  <rect x="42" y="618" width="432" height="46" rx="6" fill="#0F172A" stroke="#22304A" />
  <text x="54" y="637" fill="#8B9BB4" font-family="Segoe UI, sans-serif" font-size="11">В Базовом режиме сырой JSON/конфиг скрыт для чистоты интерфейса.</text>
  <text x="54" y="653" fill="#93C5FD" font-family="Segoe UI, sans-serif" font-size="11">Переключите «Расширенный режим» вверху для полного инженерного редактора.</text>

  <!-- Right Column: Plain-Russian Findings Cards -->
  <rect x="508" y="366" width="668" height="312" rx="8" fill="#11192B" stroke="#22304A" />
  <text x="526" y="392" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold">Что проверено и что это значит простыми словами</text>

  <rect x="526" y="408" width="632" height="82" rx="6" fill="#0B1120" stroke="#1E2C45" />
  <rect x="538" y="418" width="70" height="20" rx="4" fill="#132A20" />
  <text x="548" y="432" fill="#4ADE80" font-family="Consolas, monospace" font-size="10.5" font-weight="bold">ОТЛИЧНО</text>
  <text x="618" y="432" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold">Маскировка XHTTP + Reality защищает от лимита ТСПУ 16 КБ</text>
  <text x="538" y="454" fill="#C5D2E6" font-family="Segoe UI, sans-serif" font-size="12">Трафик выглядит как обычный HTTPS-сайт, а случайный паддинг не даёт провайдеру его распознать.</text>
  <text x="538" y="476" fill="#93C5FD" font-family="Segoe UI, sans-serif" font-size="11.5">Что делать: Ничего менять не нужно — настройка эталонная.</text>

  <rect x="526" y="498" width="632" height="82" rx="6" fill="#0B1120" stroke="#1E2C45" />
  <rect x="538" y="508" width="70" height="20" rx="4" fill="#132A20" />
  <text x="548" y="522" fill="#4ADE80" font-family="Consolas, monospace" font-size="10.5" font-weight="bold">ОТЛИЧНО</text>
  <text x="618" y="522" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold">Российские банки и Госуслуги идут напрямую (Split-Tunneling)</text>
  <text x="538" y="544" fill="#C5D2E6" font-family="Segoe UI, sans-serif" font-size="12">Домены .ru и российские IP не перегружают зарубежный ВПН-сервер и открываются мгновенно.</text>
  <text x="538" y="566" fill="#93C5FD" font-family="Segoe UI, sans-serif" font-size="11.5">Что делать: Всё работает правильно.</text>

  <rect x="526" y="588" width="632" height="78" rx="6" fill="#0B1120" stroke="#1E2C45" />
  <rect x="538" y="598" width="70" height="20" rx="4" fill="#2E2411" />
  <text x="550" y="612" fill="#FBBF24" font-family="Consolas, monospace" font-size="10.5" font-weight="bold">СОВЕТ</text>
  <text x="618" y="612" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold">Проверьте репутацию IP во вкладке «Шаг 2 · Репутация IP и Google RU»</text>
  <text x="538" y="634" fill="#C5D2E6" font-family="Segoe UI, sans-serif" font-size="12">Убедитесь, что YouTube Premium, Google Gemini и поиск Google не получили метку RU на этом узле.</text>
  <text x="538" y="654" fill="#93C5FD" font-family="Segoe UI, sans-serif" font-size="11.5">Что делать: Перейдите на вкладку «ШАГ 2» и нажмите «Проверить активный IP и Google RU».</text>
</svg>
