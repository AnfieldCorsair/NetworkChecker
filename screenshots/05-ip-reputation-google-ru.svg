  <!-- Left Column: 4-Signal Google RU Geo-Poisoning Verdict -->
  <rect x="22" y="244" width="538" height="290" rx="8" fill="#11192B" stroke="#EF4444" stroke-width="1.8" />
  <text x="38" y="266" fill="#93C5FD" font-family="Consolas, monospace" font-size="10.5" font-weight="bold">КОМПЛЕКСНЫЙ 4-СИГНАЛЬНЫЙ ЗОНД GOOGLE / YOUTUBE (ОБХОД EU-CONSENT)</text>
  <text x="38" y="290" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="13.5" font-weight="bold">КРИТИЧНО: Обнаружена «прокажённая метка RU» (сервер NL → Google = RU)</text>
  <text x="38" y="310" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="11.5">Все 4 сигнала подтвердили перепривязку этой зарубежной подсети к России.</text>

  <!-- Signal 1 -->
  <rect x="38" y="322" width="506" height="44" rx="5" fill="#0B1120" stroke="#1E2C45" />
  <text x="50" y="340" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="bold">1. YouTube INNERTUBE_CONTEXT_GL (sw.js_data)</text>
  <text x="454" y="340" fill="#F87171" font-family="Consolas, monospace" font-size="11.5" font-weight="bold">МЕТКА RU!</text>
  <text x="50" y="357" fill="#9BAAC2" font-family="Segoe UI, sans-serif" font-size="10.5">Критично: зарубежный IP (NL), но YouTube вернул регион РФ</text>

  <!-- Signal 2 -->
  <rect x="38" y="372" width="506" height="44" rx="5" fill="#0B1120" stroke="#1E2C45" />
  <text x="50" y="390" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="bold">2. Доступность YouTube Premium (/premium?hl=en)</text>
  <text x="444" y="390" fill="#F87171" font-family="Consolas, monospace" font-size="11.5" font-weight="bold">НЕДОСТУПЕН</text>
