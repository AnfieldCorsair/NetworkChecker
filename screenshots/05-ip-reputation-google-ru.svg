  <text x="606" y="410" fill="#C5D2E6" font-family="Segoe UI, sans-serif" font-size="11.5">Популярный у РФ-ВПН хостер (частый спуфинг Google GL=RU на подсети)</text>

  <!-- Row 2 -->
  <rect x="592" y="440" width="568" height="106" rx="6" fill="#0B1120" stroke="#10B981" />
  <text x="606" y="462" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold">#2 · ⚡ Автовыбор (proxy-fi) — VLESS XHTTP :443</text>
  <text x="1058" y="462" fill="#4ADE80" font-family="Consolas, monospace" font-size="12">FI (Finland)</text>
  <text x="606" y="482" fill="#93C5FD" font-family="Consolas, monospace" font-size="11.5">fi-edge.example.com → 95.216.14.88 · AS24940 · Hetzner Online GmbH</text>
  <text x="606" y="504" fill="#4ADE80" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold">[Риск метки RU: Низкий (GL=FI)] · [ТСПУ 16 КБ: Защищено XHTTP] · Proxy: НЕТ</text>
  <text x="606" y="526" fill="#C5D2E6" font-family="Segoe UI, sans-serif" font-size="11.5">Чистый зарубежный ДЦ — YouTube Premium, Gemini и Google Search работают чисто</text>

  <!-- Row 3 -->
  <rect x="592" y="556" width="568" height="108" rx="6" fill="#0B1120" stroke="#10B981" />
  <text x="606" y="578" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold">#3 · 🌍 Запасной протокол — HYSTERIA2 :443</text>
  <text x="1052" y="578" fill="#4ADE80" font-family="Consolas, monospace" font-size="12">DE (Germany)</text>
  <text x="606" y="598" fill="#93C5FD" font-family="Consolas, monospace" font-size="11.5">de-hy2.example.com → 194.36.144.20 · AS51167 · Contabo GmbH</text>
  <text x="606" y="620" fill="#4ADE80" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold">[Риск метки RU: Низкий (GL=DE)] · [QUIC + Salamander Obfs] · Proxy: НЕТ</text>
  <text x="606" y="642" fill="#C5D2E6" font-family="Segoe UI, sans-serif" font-size="11.5">Чистый немецкий пул IP — Google и YouTube открываются с регионом DE без капчи</text>
