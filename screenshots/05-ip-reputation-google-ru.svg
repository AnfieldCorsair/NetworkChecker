    <text x="38" y="330" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="11.5">Физически сервер в Нидерландах (NL), но база Google пометила эту подсеть как Россию (RU)</text>
    <text x="38" y="348" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="11.5">из-за трафика смартфонов с российскими Wi-Fi/GPS. Не открывается Gemini, YouTube = RU.</text>
    <rect x="38" y="362" width="498" height="44" rx="5" fill="#0B1120" />
