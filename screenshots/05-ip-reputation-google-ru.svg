  <text x="38" y="642" fill="#E2E8F0" font-family="Consolas, monospace" font-size="10.5">ipinfo.io (37 мс): NL · AS210644 · Hosting ДА   | Cloudflare (19 мс): NL · Edge AMS · IP Match</text>
  <text x="38" y="664" fill="#93C5FD" font-family="Segoe UI, sans-serif" font-size="11">Рекомендация: выберите чистый узел FI/DE справа или направьте geosite:google в чистый outbound.</text>

