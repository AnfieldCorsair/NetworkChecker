  <text x="50" y="457" fill="#9BAAC2" font-family="Segoe UI, sans-serif" font-size="10.5">Gemini отклонил IP по региону (/unsupported · HTTP 403)</text>

  <!-- Signal 4 -->
  <rect x="38" y="472" width="506" height="48" rx="5" fill="#0B1120" stroke="#1E2C45" />
