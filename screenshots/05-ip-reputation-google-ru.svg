  <rect x="22" y="180" width="1156" height="52" rx="8" fill="#11192B" stroke="#22304A" />
  <rect x="36" y="191" width="538" height="30" rx="5" fill="#0B1120" stroke="#2E446B" />
  <text x="48" y="210" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="11.5">Режим: 2. Авто-прокси клиента ВПН (Happ / v2rayN / Sing-box на 10809/2080)</text>
  <rect x="586" y="191" width="272" height="30" rx="5" fill="#2563EB" />
  <text x="614" y="210" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold">Проверить активный IP и Google RU</text>
  <rect x="870" y="191" width="294" height="30" rx="5" fill="#162238" stroke="#3B82F6" />
