  <text x="226" y="103" fill="#8B9BB4" font-family="Segoe UI, Inter, sans-serif" font-size="10.5">Классика DoH и Приватный Ninja</text>

  <rect x="408" y="54" width="186" height="58" rx="6" fill="#0F172A" stroke="#22304A" />
