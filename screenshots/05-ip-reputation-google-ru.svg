  <rect x="0" y="123" width="1200" height="44" fill="#11192B" />
  <line x1="0" y1="167" x2="1200" y2="167" stroke="#22304A" stroke-width="1" />
  <text x="22" y="149" fill="#FFFFFF" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="bold">Репутация IP и Google RU <tspan fill="#C5D2E6" font-weight="normal" font-size="12">· 4-сигнальный зонд Google/YouTube (с обходом EU-согласия), консенсус 4 GeoIP-баз и пакетный сканер всех IP подписки.</tspan></text>

