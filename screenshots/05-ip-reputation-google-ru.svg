  <rect x="38" y="422" width="506" height="44" rx="5" fill="#0B1120" stroke="#1E2C45" />
  <text x="50" y="440" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="bold">3. Доступ к Google Gemini / AI (gemini.google.com/app)</text>
