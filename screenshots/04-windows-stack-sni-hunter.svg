<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
    <rect width="1200" height="700" fill="#0B1120" rx="10" />
    <!-- Top Bar -->
    <rect x="0" y="0" width="1200" height="122" fill="#0D1526" />
    <line x1="0" y1="122" x2="1200" y2="122" stroke="#22304A" stroke-width="1" />
    <text x="22" y="34" fill="#FFFFFF" font-family="Segoe UI, Inter, sans-serif" font-size="19" font-weight="bold">Контур ВПН</text>
    <rect x="148" y="16" width="350" height="24" rx="4" fill="#131F36" stroke="#253859" />
    <text x="158" y="32" fill="#93C5FD" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">NetworkChecker V2 v2.2 · Подписки Happ / VLESS / AWG / HY2</text>
    <rect x="920" y="14" width="258" height="28" rx="5" fill="#2563EB" />
    <text x="936" y="32" fill="#FFFFFF" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="600">Расширенный режим (6 вкладок)</text>
    
      <rect x="20" y="54" width="186" height="58" rx="6" fill="#0F172A" stroke="#22304A" stroke-width="1" />
      <text x="32" y="71" fill="#60A5FA" font-family="Consolas, monospace" font-size="10" font-weight="bold">ШАГ 1</text>
      <text x="32" y="88" fill="#FFFFFF" font-family="Segoe UI, Inter, sans-serif" font-size="12.5" font-weight="600">Проверка ВПН и подписки</text>
      <text x="32" y="103" fill="#8B9BB4" font-family="Segoe UI, Inter, sans-serif" font-size="10.5">Ссылки · Happ · VLESS · AWG</text>
    
      <rect x="214" y="54" width="186" height="58" rx="6" fill="#0F172A" stroke="#22304A" stroke-width="1" />
      <text x="226" y="71" fill="#60A5FA" font-family="Consolas, monospace" font-size="10" font-weight="bold">ШАГ 2</text>
      <text x="226" y="88" fill="#FFFFFF" font-family="Segoe UI, Inter, sans-serif" font-size="12.5" font-weight="600">Защита DNS</text>
      <text x="226" y="103" fill="#8B9BB4" font-family="Segoe UI, Inter, sans-serif" font-size="10.5">Классика DoH и Приватный Ninja</text>
    
      <rect x="408" y="54" width="186" height="58" rx="6" fill="#0F172A" stroke="#22304A" stroke-width="1" />
      <text x="420" y="71" fill="#60A5FA" font-family="Consolas, monospace" font-size="10" font-weight="bold">ШАГ 3</text>
      <text x="420" y="88" fill="#FFFFFF" font-family="Segoe UI, Inter, sans-serif" font-size="12.5" font-weight="600">Проверка блокировок</text>
      <text x="420" y="103" fill="#8B9BB4" font-family="Segoe UI, Inter, sans-serif" font-size="10.5">ТСПУ · 16 КБ · UDP · Белые списки</text>
    
      <rect x="602" y="54" width="186" height="58" rx="6" fill="#17253F" stroke="#3B82F6" stroke-width="1.8" />
      <text x="614" y="71" fill="#60A5FA" font-family="Consolas, monospace" font-size="10" font-weight="bold">ШАГ 4</text>
      <text x="614" y="88" fill="#FFFFFF" font-family="Segoe UI, Inter, sans-serif" font-size="12.5" font-weight="600">Сеть Windows и SNI</text>
      <text x="614" y="103" fill="#8B9BB4" font-family="Segoe UI, Inter, sans-serif" font-size="10.5">TUN · Утечки · Reality TLS 1.3</text>
    
      <rect x="796" y="54" width="186" height="58" rx="6" fill="#0F172A" stroke="#22304A" stroke-width="1" />
      <text x="808" y="71" fill="#60A5FA" font-family="Consolas, monospace" font-size="10" font-weight="bold">ШАГ 5</text>
      <text x="808" y="88" fill="#FFFFFF" font-family="Segoe UI, Inter, sans-serif" font-size="12.5" font-weight="600">Репутация IP и Google RU</text>
      <text x="808" y="103" fill="#8B9BB4" font-family="Segoe UI, Inter, sans-serif" font-size="10.5">Метка RU у Google и все IP подписки</text>
    
      <rect x="990" y="54" width="186" height="58" rx="6" fill="#0F172A" stroke="#22304A" stroke-width="1" />
      <text x="1002" y="71" fill="#60A5FA" font-family="Consolas, monospace" font-size="10" font-weight="bold">ШАГ 6</text>
      <text x="1002" y="88" fill="#FFFFFF" font-family="Segoe UI, Inter, sans-serif" font-size="12.5" font-weight="600">Заявка в техподдержку</text>
      <text x="1002" y="103" fill="#8B9BB4" font-family="Segoe UI, Inter, sans-serif" font-size="10.5">Готовый отчёт без паролей</text>
    
    <!-- Guide Strip -->
    <rect x="0" y="123" width="1200" height="52" fill="#11192B" />
    <line x1="0" y1="175" x2="1200" y2="175" stroke="#22304A" stroke-width="1" />
    <text x="22" y="145" fill="#FFFFFF" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="bold">Сеть Windows и SNI <tspan fill="#93C5FD" font-weight="normal">· Что здесь проверяется и что нажимать:</tspan></text>
    <text x="22" y="164" fill="#C5D2E6" font-family="Segoe UI, Inter, sans-serif" font-size="12">Слева проверяется сетевой стек Windows (TUN/Wintun, отсутствие утечек DNS и IPv6). Справа — живой подбор SNI для VLESS Reality по RFC 8446 TLS 1.3.</text>
    <!-- Body -->
    
    <!-- Left Column: Windows Network Stack -->
    <rect x="22" y="192" width="520" height="486" rx="8" fill="#11192B" stroke="#22304A" />
    <text x="38" y="218" fill="#93C5FD" font-family="Consolas, monospace" font-size="11" font-weight="bold">АУДИТ СЕТЕВОГО СТЕКА ОС WINDOWS (L3 TUN / DNS / IPV6 / ПРОКСИ-ПОРТЫ)</text>

    <rect x="38" y="234" width="488" height="82" rx="6" fill="#0B1120" stroke="#10B981" />
    <text x="52" y="256" fill="#4ADE80" font-family="Segoe UI, sans-serif" font-size="13.5" font-weight="bold">✓ Активен виртуальный TUN-адаптер (singbox_tun · MTU 1400)</text>
    <text x="52" y="276" fill="#C5D2E6" font-family="Segoe UI, sans-serif" font-size="11.5">Весь TCP и UDP трафик системы перехватывается на сетевом уровне L3.</text>
    <text x="52" y="296" fill="#93C5FD" font-family="Consolas, monospace" font-size="11">IPv4: 172.19.0.1 · DNS: перехват через TUN (hijack-dns / FakeIP)</text>

    <rect x="38" y="328" width="488" height="72" rx="6" fill="#0B1120" stroke="#10B981" />
    <text x="52" y="350" fill="#4ADE80" font-family="Segoe UI, sans-serif" font-size="13.5" font-weight="bold">✓ Глобальных IPv6-утечек (2000::/3) вне туннеля не обнаружено</text>
    <text x="52" y="370" fill="#C5D2E6" font-family="Segoe UI, sans-serif" font-size="11.5">Служебные интерфейсы WSL / Hyper-V и заглушки fec0:0:0:ffff:: отфильтрованы.</text>

    <rect x="38" y="412" width="488" height="86" rx="6" fill="#0B1120" stroke="#22304A" />
    <text x="52" y="434" fill="#93C5FD" font-family="Consolas, monospace" font-size="11" font-weight="bold">ЛОКАЛЬНЫЕ ПОРТЫ ВПН-КЛИЕНТОВ И ЗАМЕР TCP RTT ДО СЕРВЕРА</text>
    <text x="52" y="456" fill="#4ADE80" font-family="Consolas, monospace" font-size="11.5">• Порт 10808 (SOCKS5) и 10809 (HTTP) — АКТИВНЫ (127.0.0.1 · Happ / Xray)</text>
    <text x="52" y="478" fill="#E2E8F0" font-family="Consolas, monospace" font-size="11.5">• TCP RTT до ВПН-узла (10 проб): Min 36 мс · Avg 39 мс · Jitter 3 мс · Потери 0%</text>

    <!-- Right Column: RFC 8446 TLS 1.3 Reality SNI Hunter -->
    <rect x="558" y="192" width="620" height="486" rx="8" fill="#11192B" stroke="#22304A" />
    <text x="576" y="218" fill="#93C5FD" font-family="Consolas, monospace" font-size="11" font-weight="bold">ПОДБОР РАБОЧЕГО SNI ДЛЯ VLESS REALITY (СЫРОЙ ПАКЕТ RFC 8446 TLS 1.3 CLIENTHELLO)</text>
    <text x="576" y="238" fill="#C5D2E6" font-family="Segoe UI, sans-serif" font-size="11.5">Отправляет реальный TLS 1.3 ClientHello (X25519 + ALPN h2) и проверяет ServerHello 0x0304 без HelloRetryRequest</text>

    <!-- SNI Candidate Rows -->
    <rect x="576" y="254" width="584" height="72" rx="6" fill="#0B1120" stroke="#10B981" />
    <text x="592" y="276" fill="#FFFFFF" font-family="Consolas, monospace" font-size="13.5" font-weight="bold">www.microsoft.com</text>
    <text x="800" y="276" fill="#4ADE80" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold">✓ ИДЕАЛЕН ДЛЯ REALITY (TLS 1.3 · h2 · 34 мс)</text>
    <text x="592" y="298" fill="#9BAAC2" font-family="Consolas, monospace" font-size="11">Cipher: TLS_AES_128_GCM_SHA256 (0x1301) · HRR: Нет · Сертификат валиден (218 дн.)</text>
    <rect x="1010" y="290" width="136" height="26" rx="4" fill="#2563EB" />
    <text x="1022" y="307" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600">Вшить SNI в конфиг</text>

    <rect x="576" y="336" width="584" height="72" rx="6" fill="#0B1120" stroke="#10B981" />
    <text x="592" y="358" fill="#FFFFFF" font-family="Consolas, monospace" font-size="13.5" font-weight="bold">www.nvidia.com</text>
    <text x="800" y="358" fill="#4ADE80" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold">✓ ИДЕАЛЕН ДЛЯ REALITY (TLS 1.3 · h2 · 39 мс)</text>
    <text x="592" y="380" fill="#9BAAC2" font-family="Consolas, monospace" font-size="11">Cipher: TLS_AES_256_GCM_SHA384 (0x1302) · HRR: Нет · Сертификат валиден (184 дн.)</text>
    <rect x="1010" y="372" width="136" height="26" rx="4" fill="#2563EB" />
    <text x="1022" y="389" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600">Вшить SNI в конфиг</text>

    <rect x="576" y="418" width="584" height="72" rx="6" fill="#0B1120" stroke="#10B981" />
    <text x="592" y="440" fill="#FFFFFF" font-family="Consolas, monospace" font-size="13.5" font-weight="bold">www.amd.com</text>
    <text x="800" y="440" fill="#4ADE80" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold">✓ ИДЕАЛЕН ДЛЯ REALITY (TLS 1.3 · h2 · 41 мс)</text>
    <text x="592" y="462" fill="#9BAAC2" font-family="Consolas, monospace" font-size="11">Cipher: TLS_AES_128_GCM_SHA256 (0x1301) · HRR: Нет · Сертификат валиден (140 дн.)</text>
    <rect x="1010" y="454" width="136" height="26" rx="4" fill="#2563EB" />
    <text x="1022" y="471" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600">Вшить SNI в конфиг</text>

    <rect x="576" y="500" width="584" height="68" rx="6" fill="#0B1120" stroke="#EF4444" />
    <text x="592" y="522" fill="#FCA5A5" font-family="Consolas, monospace" font-size="13.5" font-weight="bold">ya.ru</text>
    <text x="800" y="522" fill="#F87171" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold">✗ НЕ ПОДХОДИТ ДЛЯ REALITY (HelloRetryRequest / TLS 1.2)</text>
    <text x="592" y="544" fill="#9BAAC2" font-family="Consolas, monospace" font-size="11">Сервер запросил смену группы ключей (HRR) — Xray Reality отклонит такой домен маскировки.</text>
    
  </svg>
