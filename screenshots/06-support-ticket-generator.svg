    <text x="22" y="164" fill="#C5D2E6" font-family="Segoe UI, Inter, sans-serif" font-size="12">1) Снимите срез без ВПН. 2) Снимите срез с ВПН. 3) Отметьте все наблюдаемые проблемы галочками и скопируйте готовый отчёт без паролей и без привязки к 1 узлу.</text>
